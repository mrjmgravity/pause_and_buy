<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pause & Buy - PWA</title>
  <link rel="manifest" href="/manifest.json">
  <script>
  async function registerServiceWorker(){
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.register('/sw.js');
      console.log('SW registered', reg);
      return reg;
    }
  }
  async function subscribeForPush(){
    const reg = await registerServiceWorker();
    const res = await fetch('/vapid_public');
    const {publicKey} = await res.json();
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
    await fetch('/save-subscription', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(sub)});
    alert('Subscription saved');
  }
  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }
  </script>
</head>
<body>
  <h1>Pause & Buy (PWA)</h1>
  <p>Ak chcete notifikácie, zaregistrujte sa:</p>
  <button onclick="subscribeForPush()">Povoliť notifikácie</button>
  <p>Pri testovaní používajte HTTPS (ngrok alebo hostovanie).</p>
</body>
</html>
